<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>தமிழ் ஹதீஸ் தொகுப்பு — தேடல் &amp; வாசிப்பு</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F3F7FD;
    --surface:#FFFFFF;
    --surface-2:#EAF1FC;
    --primary:#175CD3;
    --primary-dark:#0F3F94;
    --primary-soft:#E4EEFC;
    --text:#101828;
    --text-soft:#475467;
    --text-faint:#98A2B3;
    --border:#E1E8F5;
    --border-soft:#EDF2FB;
    --green-grade:#1B7A43; --green-grade-bg:#E1F5E9;
    --blue-grade:#175CD3;  --blue-grade-bg:#E4EEFC;
    --amber-grade:#B54708; --amber-grade-bg:#FCEEE0;
    --grey-grade:#475467;  --grey-grade-bg:#EEF1F6;
    --radius:12px;
    --radius-sm:8px;
    --maxw:760px;
    --hf-scale:1;
    --shadow:0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.06);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Noto Sans Tamil','Inter',Arial,sans-serif;
    font-size:16px;
    line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}
  .ui{font-family:'Noto Sans Tamil','Inter',Arial,sans-serif;}

  ::selection{background:var(--primary-soft); color:var(--primary-dark);}
  mark{
    background:#FFE58A; color:#5C4300;
    padding:0 2px; border-radius:3px;
  }

  /* ---------- header ---------- */
  header.site-head{
    position:sticky; top:0; z-index:20;
    background:var(--surface);
    border-bottom:1px solid var(--border);
  }
  .head-row{
    max-width:920px; margin:0 auto;
    padding:14px 20px;
    display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
  }
  .brand{
    display:flex; align-items:center; gap:10px; cursor:pointer;
    text-decoration:none;
  }
  .brand .mark{
    width:34px; height:34px; border-radius:9px;
    background:linear-gradient(155deg, var(--primary), var(--primary-dark));
    color:#fff; display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:1.05rem; flex:0 0 auto;
  }
  .brand .titles{display:flex; flex-direction:column; gap:1px;}
  .brand .title{font-weight:700; font-size:1.1rem; color:var(--text);}
  .brand .subtitle{font-size:.72rem; color:var(--text-faint);}

  .font-ctrl{
    display:flex; align-items:center; gap:2px;
    background:var(--surface-2); border:1px solid var(--border);
    border-radius:20px; padding:3px;
  }
  .font-ctrl button{
    border:none; background:transparent; color:var(--primary-dark);
    width:30px; height:30px; border-radius:16px; cursor:pointer;
    font-family:'Inter',sans-serif; font-weight:700; font-size:.85rem;
  }
  .font-ctrl button:hover{background:var(--surface);}
  .font-ctrl .lbl{
    font-size:.68rem; color:var(--text-faint); padding:0 6px; white-space:nowrap;
  }

  /* ---------- layout ---------- */
  main{max-width:var(--maxw); margin:0 auto; padding:26px 20px 80px; transition:max-width .15s ease;}
  main.wide-home{max-width:1040px;}

  .crumbs{
    font-size:.82rem; color:var(--text-faint);
    margin-bottom:20px;
  }
  .crumbs a{color:var(--primary); text-decoration:none;}
  .crumbs a:hover{text-decoration:underline;}
  .crumbs .sep{margin:0 6px; color:var(--text-faint);}

  h1.page-title{
    font-size:1.5rem; font-weight:700; color:var(--text);
    margin:0 0 4px;
  }
  p.page-meta{
    color:var(--text-soft); font-size:.85rem; margin:0 0 22px;
  }

  /* ---------- home hero ---------- */
  .hero{margin-bottom:22px;}
  .hero h1{
    font-size:1.9rem; font-weight:700; color:var(--text);
    margin:0 0 8px; line-height:1.3;
  }
  .hero p{
    color:var(--text-soft); font-size:1rem; max-width:56ch; margin:0;
  }

  /* ---------- search panel (shared: home + book pages) ---------- */
  .search-panel{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:20px 22px;
    margin-bottom:28px;
  }
  .search-panel h2{
    font-size:.95rem; font-weight:700; color:var(--primary-dark);
    margin:0 0 14px;
  }
  .search-row{
    display:flex; gap:8px; margin-bottom:14px;
  }
  .search-row input[type="search"]{
    flex:1; border:1px solid var(--border); border-radius:999px;
    background:var(--surface-2); outline:none;
    font-size:.96rem; color:var(--text); padding:11px 16px;
  }
  .search-row input[type="search"]:focus{border-color:var(--primary); background:var(--surface);}
  .search-row button{
    border:none; background:var(--primary); color:#fff;
    font-weight:600; font-size:.92rem; padding:0 22px; border-radius:999px; cursor:pointer;
  }
  .search-row button:hover{background:var(--primary-dark);}

  fieldset.search-modes{
    border:none; margin:0 0 12px; padding:0;
    display:flex; flex-wrap:wrap; gap:8px 16px;
    font-size:.84rem;
  }
  fieldset.search-modes legend{
    font-size:.74rem; color:var(--text-faint); padding:0 0 6px; width:100%;
  }
  fieldset.search-modes label{
    display:flex; align-items:center; gap:6px; color:var(--text-soft); cursor:pointer;
  }
  fieldset.search-modes input[type="radio"]{accent-color:var(--primary);}

  .search-extra{
    display:flex; flex-wrap:wrap; gap:8px 16px; margin-bottom:10px;
    font-size:.84rem; color:var(--text-soft);
  }
  .search-extra label{display:flex; align-items:center; gap:6px; cursor:pointer;}
  .search-extra input[type="checkbox"]{accent-color:var(--primary);}

  .search-hint{
    font-size:.76rem; color:var(--text-faint); margin:8px 0 0; line-height:1.6;
  }
  .search-hint b{color:var(--text-soft);}
  .search-hint code{background:var(--surface-2); padding:0 5px; border-radius:4px;}

  /* ---------- book list (home) ---------- */
  .list-toolbar{
    display:flex; align-items:baseline; justify-content:space-between;
    gap:12px; flex-wrap:wrap;
    padding-bottom:10px; margin-bottom:2px;
  }
  .list-toolbar h2{
    font-size:1rem; font-weight:700; color:var(--text); margin:0;
  }
  .list-toolbar .toolbar-actions{font-size:.8rem;}
  .list-toolbar .toolbar-actions button{
    background:none; border:none; color:var(--primary); cursor:pointer;
    font-family:inherit; font-size:.8rem; padding:0 4px; font-weight:600;
  }
  .list-toolbar .toolbar-actions .sep{color:var(--text-faint); margin:0 2px;}

  ul.book-list{
    list-style:none; margin:0; padding:0;
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(230px, 1fr));
    gap:12px;
  }
  ul.book-list li{
    position:relative;
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius-sm);
    padding:16px 34px 14px 14px;
    display:flex; flex-direction:column;
  }
  ul.book-list li:hover{border-color:var(--primary);}
  ul.book-list input[type="checkbox"]{
    position:absolute; top:14px; right:12px;
    width:16px; height:16px; accent-color:var(--primary);
  }
  ul.book-list .book-link{
    text-decoration:none; color:var(--text); cursor:pointer;
  }
  ul.book-list .book-name{
    font-size:1.02rem; font-weight:700; color:var(--text); line-height:1.35;
  }
  ul.book-list .book-link:hover .book-name{color:var(--primary);}
  ul.book-list .book-sub{
    font-size:.76rem; color:var(--text-faint); margin-top:5px;
  }
  .selection-note{
    font-size:.8rem; color:var(--text-soft); margin:14px 0 26px;
  }
  .selection-note strong{color:var(--primary-dark);}

  /* ---------- chapters table ---------- */
  table.chapter-table{
    width:100%; border-collapse:collapse; margin-top:6px;
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius); overflow:hidden;
  }
  table.chapter-table thead th{
    text-align:left; font-size:.74rem; color:var(--text-faint); font-weight:700;
    background:var(--surface-2);
    padding:10px 12px;
  }
  table.chapter-table tbody tr{
    border-top:1px solid var(--border-soft); cursor:pointer;
  }
  table.chapter-table tbody tr:hover{background:var(--surface-2);}
  table.chapter-table td{padding:13px 12px; vertical-align:top;}
  table.chapter-table td.ch-num{
    width:52px; color:var(--primary); font-weight:700; font-size:1rem;
  }
  table.chapter-table td.ch-title{color:var(--text); font-size:.98rem;}
  table.chapter-table td.ch-count{
    width:70px; text-align:right; font-size:.78rem; color:var(--text-faint);
  }

  /* ---------- hadith cards ---------- */
  .result-crumb{
    font-size:.76rem; color:var(--text-faint); margin:20px 0 6px;
  }
  .result-crumb:first-of-type{margin-top:0;}

  article.hadith-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:18px 20px;
    margin-bottom:16px;
    font-size:calc(1rem * var(--hf-scale));
    scroll-margin-top:84px;
    transition:box-shadow .4s ease, border-color .4s ease;
  }
  article.hadith-card.hadith-focus{
    border-color:var(--primary);
    box-shadow:0 0 0 3px var(--primary-soft), var(--shadow);
  }
  .hadith-topic{
    font-size:.95em; font-weight:700; color:var(--primary-dark);
    margin:0 0 10px;
    padding-bottom:8px;
    border-bottom:1px solid var(--border-soft);
  }
  .hadith-body p{margin:0 0 10px;}
  .hadith-body p:last-child{margin-bottom:0;}
  .hadith-num{
    color:var(--primary); font-weight:700; margin-right:2px; white-space:nowrap;
  }
  a.hadith-num-link{
    text-decoration:none; border-bottom:1px dashed var(--primary);
  }
  a.hadith-num-link:hover{background:var(--primary-soft); border-radius:3px;}
  .hadith-text{color:var(--text);}
  .hadith-grade{
    margin-top:12px; padding-top:10px; border-top:1px dashed var(--border);
    font-size:.85em; color:var(--text-soft);
  }
  .grade-pill{
    display:inline-block; padding:2px 10px; border-radius:20px;
    font-weight:600; font-size:.92em; margin-left:4px;
  }
  .grade-green{color:var(--green-grade); background:var(--green-grade-bg);}
  .grade-blue{color:var(--blue-grade); background:var(--blue-grade-bg);}
  .grade-amber{color:var(--amber-grade); background:var(--amber-grade-bg);}
  .grade-grey{color:var(--grey-grade); background:var(--grey-grade-bg);}

  /* ---------- states ---------- */
  .state-box{
    color:var(--text-soft); font-size:.95rem;
    padding:30px 0;
  }
  .state-box.error{
    color:var(--amber-grade);
    background:var(--amber-grade-bg);
    border:1px solid #F2D6B3;
    border-radius:var(--radius);
    padding:16px 18px;
  }
  .state-box code{
    background:var(--surface-2); padding:1px 6px; border-radius:4px;
    font-size:.88em; color:var(--text);
  }
  .search-warn{
    font-size:.82rem; color:var(--amber-grade);
    background:var(--amber-grade-bg); border:1px solid #F2D6B3;
    border-radius:var(--radius-sm); padding:10px 14px; margin-bottom:18px;
  }

  @media (max-width:560px){
    fieldset.search-modes{gap:8px;}
    .search-row{flex-direction:column;}
    .search-row button{padding:10px 20px;}
    .hero h1{font-size:1.5rem;}
    .brand .subtitle{display:none;}
  }

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important;}
  }
</style>
</head>
<body>

<header class="site-head">
  <div class="head-row">
    <a class="brand" href="#/" data-nav-home>
      <span class="mark">ஹ</span>
      <span class="titles">
        <span class="title">தமிழ் ஹதீஸ் தொகுப்பு</span>
        <span class="subtitle">நபிமொழி தேடல் &amp; வாசிப்பு நூலகம்</span>
      </span>
    </a>
    <div class="font-ctrl ui" title="ஹதீஸ் எழுத்து அளவு">
      <button type="button" id="font-dec">A-</button>
      <span class="lbl">எழுத்து அளவு</span>
      <button type="button" id="font-inc">A+</button>
    </div>
  </div>
</header>

<main id="app">
  <div class="state-box">ஏற்றுகிறது…</div>
</main>

<script>
(function(){
  "use strict";

  var DATA_DIR = "tamilhadith_data/";
  var MANIFEST_URL = DATA_DIR + "manifest.json";
  var FONT_SCALE_KEY = "tamilhadith-font-scale";
  var FONT_SCALE_MIN = 0.8, FONT_SCALE_MAX = 1.7, FONT_SCALE_STEP = 0.1;

  var app = document.getElementById("app");
  var manifest = null;            // array of filenames
  var bookCache = {};             // filename -> parsed book object
  var selectedFiles = new Set();  // checked filenames on home page
  var lastBookErrors = {};        // filename -> {kind, attempts, detail}

  // ---------------- generic helpers ----------------

  function escapeHtml(s){
    return String(s == null ? "" : s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  }

  function escapeRegExp(s){
    return String(s).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  }

  function titleFromFilename(fname){
    var name = fname.replace(/\.json$/i, "");
    name = name.replace(/^\s*\d+\s*[.\-–]\s*/, "");
    return name.trim() || fname;
  }

  function fieldOf(entry, name){
    return entry && Object.prototype.hasOwnProperty.call(entry, name) ? entry[name] : "";
  }

  function gradeClass(gradeRaw){
    var g = String(gradeRaw || "");
    if (g.indexOf("ளயீஃப்") !== -1 || g.indexOf("மவ்ளூவு") !== -1) return "grade-amber";
    if (g.indexOf("ஹஸன்") !== -1) return "grade-blue";
    if (g.indexOf("ஷஹீஹ்") !== -1) return "grade-green";
    return "grade-grey";
  }

  function setApp(html){ app.innerHTML = html; }
  function loading(msg){ setApp('<div class="state-box">' + escapeHtml(msg || "ஏற்றுகிறது…") + '</div>'); }
  function errorBox(msg){ setApp('<div class="state-box error">' + msg + '</div>'); }
  function navigate(hash){ location.hash = hash; }
  function chapterKeyOf(entry){ return fieldOf(entry, "அத்தியாயம்") + "||" + fieldOf(entry, "அத்தியாய தலைப்பு"); }

  // ---------------- per-user font size (client-side only) ----------------

  function getFontScale(){
    var v = parseFloat(localStorage.getItem(FONT_SCALE_KEY));
    return isNaN(v) ? 1 : v;
  }
  function setFontScale(v){
    v = Math.max(FONT_SCALE_MIN, Math.min(FONT_SCALE_MAX, v));
    document.documentElement.style.setProperty("--hf-scale", v.toFixed(2));
    try { localStorage.setItem(FONT_SCALE_KEY, v.toFixed(2)); } catch (e) {}
  }
  setFontScale(getFontScale());
  document.getElementById("font-inc").addEventListener("click", function(){ setFontScale(getFontScale() + FONT_SCALE_STEP); });
  document.getElementById("font-dec").addEventListener("click", function(){ setFontScale(getFontScale() - FONT_SCALE_STEP); });

  // ---------------- search: quoted phrases, all/any/phrase, exclude ----------------

  // Tokenizes a query into {text, exclude} parts.
  // "quoted text" (optionally preceded by -) counts as ONE token, spaces and all.
  // Unquoted runs of non-space characters (optionally preceded by -) are separate tokens.
  function tokenizeQuery(q){
    var tokens = [];
    var re = /(-)?"([^"]*)"|(-)?(\S+)/g;
    var m;
    while ((m = re.exec(String(q || ""))) !== null){
      if (m[2] !== undefined && m[2] !== ""){
        tokens.push({text: m[2], exclude: m[1] === "-"});
      } else if (m[4] !== undefined){
        tokens.push({text: m[4], exclude: m[3] === "-"});
      }
    }
    return tokens;
  }

  function parseIncludeExclude(q){
    var include = [], exclude = [];
    tokenizeQuery(q).forEach(function(tok){
      if (tok.exclude) exclude.push(tok.text); else include.push(tok.text);
    });
    return {include: include, exclude: exclude};
  }

  function stripOuterQuotes(q){
    var t = String(q || "").trim();
    if (t.length >= 2 && t.charAt(0) === '"' && t.charAt(t.length - 1) === '"'){
      return t.slice(1, -1);
    }
    return t;
  }

  function isPureNumber(q){ return /^\d+$/.test(String(q || "").trim()); }

  // Returns {matched: bool, highlightTerms: [strings to mark]}
  function evaluateQuery(haystack, mode, rawQuery){
    if (mode === "phrase"){
      var phrase = stripOuterQuotes(rawQuery);
      var matched = phrase !== "" && haystack.indexOf(phrase) !== -1;
      return {matched: matched, highlightTerms: matched ? [phrase] : []};
    }
    var pe = parseIncludeExclude(rawQuery);
    if (pe.exclude.some(function(w){ return haystack.indexOf(w) !== -1; })){
      return {matched: false, highlightTerms: []};
    }
    if (mode === "any"){
      if (pe.include.length === 0) return {matched: false, highlightTerms: []};
      var anyHit = pe.include.filter(function(w){ return haystack.indexOf(w) !== -1; });
      return {matched: anyHit.length > 0, highlightTerms: anyHit};
    }
    // default: "all"
    if (pe.include.length === 0) return {matched: true, highlightTerms: []};
    var allOk = pe.include.every(function(w){ return haystack.indexOf(w) !== -1; });
    return {matched: allOk, highlightTerms: allOk ? pe.include : []};
  }

  function highlightRaw(raw, terms){
    var text = String(raw || "");
    var clean = (terms || []).filter(Boolean);
    if (!clean.length) return text;
    var re = new RegExp("(" + clean.map(escapeRegExp).join("|") + ")", "g");
    return text.replace(re, "\u0001$1\u0002");
  }

  // ---------------- hadith rendering ----------------

  function renderHadithBody(numberLabel, rawText, highlightTerms, numLinkHref){
    var marked = highlightRaw(rawText, highlightTerms);
    var esc = escapeHtml(marked);
    var blocks = esc.split(/\n\s*\n+/);
    var paras = blocks.map(function(block){
      return block.split(/\n/).map(function(line){
        return line.replace(/^\t+/, "").trim();
      }).filter(function(l){ return l.length > 0; }).join("<br>");
    }).filter(function(p){ return p.length > 0; });

    if (paras.length === 0) paras = [""];

    var numInner = escapeHtml(numberLabel) + ".";
    var numHtml = numLinkHref
      ? '<a class="hadith-num hadith-num-link" href="' + escapeHtml(numLinkHref) + '" title="இந்த நூலில் திற">' + numInner + '</a> '
      : '<span class="hadith-num">' + numInner + '</span> ';
    paras[0] = numHtml + '<span class="hadith-text">' + paras[0] + '</span>';
    for (var i = 1; i < paras.length; i++){
      paras[i] = '<span class="hadith-text">' + paras[i] + '</span>';
    }
    var html = '<div class="hadith-body">' + paras.map(function(p){ return "<p>" + p + "</p>"; }).join("") + "</div>";
    return html.split("\u0001").join("<mark>").split("\u0002").join("</mark>");
  }

  // linkInfo: null (plain, used when already browsing inside the book) or
  // {file, chapterKey} (used only in search results) to make the hadith
  // number a link back into the book, landing on and scrolling to that hadith.
  function hadithCardHtml(entry, key, highlightTerms, linkInfo){
    var topic = fieldOf(entry, "பாட தலைப்பு");
    var grade = fieldOf(entry, "ஹதீஸ் தரம்");
    var numLinkHref = linkInfo
      ? ("#/book/" + encodeURIComponent(linkInfo.file) + "/chapter/" + encodeURIComponent(linkInfo.chapterKey) + "?h=" + encodeURIComponent(key))
      : null;

    var html = '<article class="hadith-card" id="hadith-' + escapeHtml(key) + '">';
    if (topic && String(topic).trim() !== ""){
      var topicMarked = highlightRaw(topic, highlightTerms);
      var topicHtml = escapeHtml(topicMarked).split("\u0001").join("<mark>").split("\u0002").join("</mark>");
      html += '<h3 class="hadith-topic">' + topicHtml + '</h3>';
    }
    html += renderHadithBody(key, fieldOf(entry, "ஹதீஸ்"), highlightTerms, numLinkHref);
    if (grade && String(grade).trim() !== ""){
      html += '<p class="hadith-grade">ஹதீஸ் தரம்: <span class="grade-pill ' + gradeClass(grade) + '">' + escapeHtml(grade) + '</span></p>';
    }
    html += '</article>';
    return html;
  }

  // ---------------- data loading ----------------

  function loadManifest(){
    if (manifest) return Promise.resolve(manifest);
    return fetch(MANIFEST_URL, {cache:"no-store"}).then(function(res){
      if (!res.ok) throw new Error("manifest-missing");
      return res.json();
    }).then(function(list){
      if (!Array.isArray(list)) throw new Error("manifest-bad");
      manifest = list;
      return manifest;
    });
  }

  // GitHub sometimes stores an uploaded filename in a different Unicode
  // normalization form than what's typed into manifest.json. The bytes
  // differ even though the text looks identical, so a naive fetch 404s.
  // We try a couple of normalized variants before giving up.
  function filenameCandidates(filename){
    var set = [filename];
    try {
      var nfc = filename.normalize("NFC");
      var nfd = filename.normalize("NFD");
      if (set.indexOf(nfc) === -1) set.push(nfc);
      if (set.indexOf(nfd) === -1) set.push(nfd);
    } catch (e) { /* String.normalize unsupported: use original only */ }
    return set;
  }

  function fetchBookVariant(filename){
    var url = DATA_DIR + filename.split("/").map(encodeURIComponent).join("/");
    return fetch(url, {cache:"no-store"}).then(function(res){
      if (!res.ok){
        var eNotFound = new Error("http-" + res.status);
        eNotFound.kind = "not-found";
        eNotFound.url = url;
        throw eNotFound;
      }
      return res.text().then(function(text){
        try {
          return {data: JSON.parse(text), url: url};
        } catch (parseErr){
          var eBad = new Error("invalid-json");
          eBad.kind = "invalid-json";
          eBad.url = url;
          eBad.detail = parseErr.message;
          throw eBad;
        }
      });
    });
  }

  function loadBook(filename){
    if (bookCache[filename]) return Promise.resolve(bookCache[filename]);
    var candidates = filenameCandidates(filename);
    var attempted = [];

    function tryNext(i){
      if (i >= candidates.length){
        var e = new Error("book-not-found:" + filename);
        e.kind = "not-found";
        e.attempts = attempted;
        lastBookErrors[filename] = e;
        throw e;
      }
      var variant = candidates[i];
      var url = DATA_DIR + variant.split("/").map(encodeURIComponent).join("/");
      attempted.push(url);
      return fetchBookVariant(variant).catch(function(err){
        if (err && err.kind === "invalid-json"){
          err.attempts = attempted;
          lastBookErrors[filename] = err;
          throw err; // found the file — stop trying other variants
        }
        return tryNext(i + 1);
      });
    }

    return Promise.resolve(tryNext(0)).then(function(result){
      bookCache[filename] = result.data;
      return result.data;
    });
  }

  function buildChapters(bookData){
    var order = [];
    var map = {};
    Object.keys(bookData).forEach(function(hKey){
      var entry = bookData[hKey];
      var num = fieldOf(entry, "அத்தியாயம்");
      var title = fieldOf(entry, "அத்தியாய தலைப்பு");
      var ck = num + "||" + title;
      if (!map[ck]){
        map[ck] = {num:num, title:title, key:ck, keys:[]};
        order.push(ck);
      }
      map[ck].keys.push(hKey);
    });
    order.sort(function(a,b){
      var na = parseInt(map[a].num, 10), nb = parseInt(map[b].num, 10);
      if (isNaN(na) && isNaN(nb)) return 0;
      if (isNaN(na)) return 1;
      if (isNaN(nb)) return -1;
      return na - nb;
    });
    return order.map(function(ck){ return map[ck]; });
  }

  function wireSearchPanel(opts){
    var form = document.getElementById("sp-form");
    if (!form) return;
    form.addEventListener("submit", function(e){
      e.preventDefault();
      var q = document.getElementById("sp-query").value.trim();
      if (!q) return;
      var mode = form.querySelector('input[name="sp-mode"]:checked').value;
      var titles = document.getElementById("sp-titles").checked ? "1" : "0";

      var booksParam = "";
      if (opts.scopeType === "home"){

          ? Array.from(selectedFiles).map(encodeURIComponent).join(",")
          : "";
      } else if (opts.scopeType === "book"){
        var allBooks = document.getElementById("sp-all-books").checked;
        booksParam = allBooks ? "" : encodeURIComponent(opts.file);
      }

      var hash = "#/search?q=" + encodeURIComponent(q) + "&mode=" + mode + "&titles=" + titles +
        (booksParam ? "&books=" + booksParam : "");
      navigate(hash);
    });
  }

  // ---------------- routing ----------------

  function parseHash(){
    var raw = location.hash.replace(/^#\/?/, "");
    var qIndex = raw.indexOf("?");
    var path = qIndex === -1 ? raw : raw.slice(0, qIndex);
    var query = qIndex === -1 ? "" : raw.slice(qIndex + 1);
    var params = new URLSearchParams(query);
    var segs = path.split("/").filter(Boolean);
    return {segs:segs, params:params};
  }

  function route(){
    var r = parseHash();
    var segs = r.segs, params = r.params;

    if (segs[0] === "book" && segs[1]){
      app.classList.remove("wide-home");
      var file = decodeURIComponent(segs[1]);
      if (segs[2] === "chapter" && segs[3]){
        return viewChapter(file, decodeURIComponent(segs[3]), params.get("h") || "");
      }
      return viewBook(file);
    }
    if (segs[0] === "search"){
      app.classList.remove("wide-home");
      return viewSearch(
        params.get("q") || "",
        params.get("books") || "",
        params.get("mode") || "all",
        params.get("titles") === "1"
      );
    }
    app.classList.add("wide-home");
    return viewHome();
  }

  window.addEventListener("hashchange", route);

    if (firstKey && fieldOf(data[firstKey], "நூல்")) return fieldOf(data[firstKey], "நூல்");
    return fallback;
  }

  function viewChapter(file, chapterKey, focusKey){

      var chapters = buildChapters(data);
      var chapter = chapters.filter(function(c){ return c.key === chapterKey; })[0];
      var bookTitle = resolveBookTitle(data, titleFromFilename(file));

      if (!chapter){
        errorBox("இந்த அத்தியாயம் கிடைக்கவில்லை.");
        return;
      }

      // Plain (non-linking) cards — we're already inside the book, so the
      // hadith number should NOT be a link here.
      var cards = chapter.keys.map(function(k){
        return hadithCardHtml(data[k], k, [], null);
      }).join("");

      setApp(
        '<p class="crumbs"><a href="#/">முகப்பு</a><span class="sep">›</span>' +

  function viewSearch(query, booksParam, mode, includeTitles){
    query = (query || "").trim();
    var targetFiles = booksParam ? booksParam.split(",").map(decodeURIComponent).filter(Boolean) : [];

    if (!query){
      errorBox("தேட வேண்டிய வார்த்தை அல்லது ஹதீஸ் எண்ணை உள்ளிடவும்.");
      return;
    }

    loading("நூல் பட்டியல் ஏற்றப்படுகிறது…");
    loadManifest().then(function(list){
      var files = targetFiles.length ? targetFiles : list;
      files = files.filter(function(f){ return list.indexOf(f) !== -1; });

      if (files.length === 0){
        errorBox("தேடலுக்கான நூல்கள் எதுவும் கிடைக்கவில்லை.");
        return;
      }

      var numericQuery = isPureNumber(query) ? parseInt(query, 10) : null;
      var results = [];
      var skipped = [];
      var loadedCount = 0;

      function step(){
        if (loadedCount >= files.length){
          renderResults();
          return;
        }
        var f = files[loadedCount];
        loading("தேடுகிறது… (" + (loadedCount + 1) + " / " + files.length + " நூல்கள்)");
        loadBook(f).then(function(data){
          var bookTitle = resolveBookTitle(data, titleFromFilename(f));

          Object.keys(data).forEach(function(hKey){
            var entry = data[hKey];

            if (numericQuery !== null){
              var kNum = parseInt(hKey, 10);
              if (!isNaN(kNum) && kNum === numericQuery){
                results.push({file:f, bookTitle:bookTitle, key:hKey, entry:entry, highlightTerms:[],
                  chapterKey: chapterKeyOf(entry), chapterTitle: fieldOf(entry, "அத்தியாய தலைப்பு")});
              }
              return;
            }

            var haystack = fieldOf(entry, "ஹதீஸ்") || "";
            if (includeTitles){
              haystack = haystack + " " + (fieldOf(entry, "அத்தியாய தலைப்பு") || "") + " " + (fieldOf(entry, "பாட தலைப்பு") || "");
            }
            var res = evaluateQuery(haystack, mode, query);
            if (res.matched){
              results.push({
                file:f, bookTitle:bookTitle, key:hKey, entry:entry, highlightTerms:res.highlightTerms,
                chapterKey: chapterKeyOf(entry), chapterTitle: fieldOf(entry, "அத்தியாய தலைப்பு")
              });
            }
          });
        }).catch(function(err){
          skipped.push({file:f, bookTitle:titleFromFilename(f), err:err});
        }).then(function(){ loadedCount++; step(); });
      }

      var modeLabel = mode === "any" ? "ஏதேனும் ஒரு வார்த்தை" : (mode === "phrase" ? "சரியான சொற்றொடர்" : "அனைத்து வார்த்தைகளும்");

      function renderResults(){
        var heading = '<p class="crumbs"><a href="#/">முகப்பு</a><span class="sep">›</span>தேடல் முடிவுகள்</p>' +
          '<h1 class="page-title">“' + escapeHtml(query) + '” — தேடல் முடிவுகள்</h1>' +
          '<p class="page-meta">' + results.length + ' முடிவுகள் · ' + files.length + ' நூல்(கள்) தேடப்பட்டன · முறை: ' + escapeHtml(modeLabel) + '</p>';

        var warn = "";
        if (skipped.length){
          var items = skipped.map(function(s){
            var reason = (s.err && s.err.kind === "invalid-json") ? "தவறான JSON" : "கோப்பு கிடைக்கவில்லை";
            return escapeHtml(s.bookTitle) + " (" + reason + ")";
          }).join(", ");
          warn = '<p class="search-warn">இந்த நூல்(கள்) தேடலில் சேர்க்கப்படவில்லை: ' + items + '</p>';
        }

        if (results.length === 0){
          setApp(heading + warn + '<div class="state-box">பொருந்தும் ஹதீஸ் எதுவும் கிடைக்கவில்லை.</div>');
          return;
        }

        var body = results.map(function(r){
          return (
            '<p class="result-crumb">' + escapeHtml(r.bookTitle) +
              (r.chapterTitle ? ' · ' + escapeHtml(r.chapterTitle) : '') +
            '</p>' +
            hadithCardHtml(r.entry, r.key, r.highlightTerms, {file:r.file, chapterKey:r.chapterKey})
          );
        }).join("");

        setApp(heading + warn + body);
      }

      step();
    }).catch(function(){
      errorBox("நூல் பட்டியலைப் பெற முடியவில்லை.");
    });
  }

  // ---------------- boot ----------------

  document.querySelector("[data-nav-home]").addEventListener("click", function(e){
    e.preventDefault();
    navigate("#/");
  });

  route();
})();
</script>

</html>
